name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm typecheck:scripts
      - run: pnpm lint
      - run: pnpm test:env
      - run: pnpm test:dependencies
      - run: pnpm test:auth
      - run: pnpm test:observability
      - run: pnpm test:provider
      - run: pnpm test:db
      - run: pnpm test:owner-import
      - run: pnpm test:owner-cache
      - run: pnpm test:reporting-dates
      - run: pnpm test:demo
      - run: pnpm build:isolated owner pos superadmin landing
        env:
          RAKKU_BUILD_DIRECTORY: .next-hardening-ci
      - run: pnpm test:auth:http
        env:
          RAKKU_BUILD_DIRECTORY: .next-hardening-ci

  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rakku_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rakku_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rakku_test
      RAKKU_ALLOW_DISPOSABLE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:test:migrate
      - run: pnpm test:concurrency

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --json > dependency-audit.json || true
      - run: pnpm audit:summary
